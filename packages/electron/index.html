<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Email IA — Electron spike</title>
  </head>
  <body>
    <h1>Email IA</h1>
    <p id="status">Electron spike en marcha</p>
    <p id="ipc"></p>
    <script>
      const status = document.getElementById('status');
      const ipc = document.getElementById('ipc');
      if (window.emailIa) {
        status.textContent = `Preload OK: ${window.emailIa.probe}`;
        if (window.emailIa.ping) {
          window.emailIa.ping().then((res) => {
            ipc.textContent = `IPC ping: ${res}`;
          });
        }
      }
    </script>
  </body>
</html>
